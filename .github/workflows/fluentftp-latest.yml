name: FluentFTP latest

# Runs the client's tests against the newest stable FluentFTP, every Monday and by hand (Actions >
# FluentFTP latest > Run workflow, where another version can be given), to find out early whether a
# new release still works with the client, which relies on FluentFTP's protected virtual
# connection hooks. Informational only: it changes no file in the repository (the version is a
# command-line property), opens no pull request, never contacts the DATASUS server, and is a
# workflow of its own, so a failure here blocks nothing.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "FluentFTP version to test, e.g. 54.2.1 (empty: the newest stable)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  latest:
    name: Client tests on FluentFTP ${{ inputs.version || 'newest' }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # PowerShell is on both runners, so this step does not depend on other tools. A requested
      # version must be a plain version number published on nuget.org: it ends up in an MSBuild
      # property, so nothing else may get through.
      - id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $versions = (Invoke-RestMethod https://api.nuget.org/v3-flatcontainer/fluentftp/index.json).versions
          $requested = "$env:REQUESTED_VERSION".Trim()
          if ($requested -eq '') {
            $version = @($versions | Where-Object { $_ -notmatch '-' })[-1]
            "Newest stable FluentFTP: $version"
          } elseif ($requested -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$' -or $versions -notcontains $requested) {
            Write-Error "FluentFTP version '$requested' is not a published stable version."
            exit 1
          } else {
            $version = $requested
            "Requested FluentFTP: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      # The exact version, in brackets; a range with a comma cannot be passed with -p.
      - shell: bash
        env:
          FLUENTFTP_VERSION: ${{ steps.version.outputs.value }}
        run: dotnet build tests/DbSus.Client.Tests --configuration Release "-p:FluentFtpVersion=[$FLUENTFTP_VERSION]"

      - run: dotnet test --project tests/DbSus.Client.Tests --configuration Release --no-build
