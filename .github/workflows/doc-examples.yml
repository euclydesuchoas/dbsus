name: Documentation examples

# Compiles the csharp blocks of README.md and docs/*.md (net10.0 and net472, C# 8, no implicit
# usings) and runs those that need neither the network nor a database, against the committed
# fixture; also checks that their links are absolute and point at existing files (or, for the CI
# badge, at the page of an existing workflow). Blocks marked "csharp no-check" (Dapper,
# SqlBulkCopy) are left out and checked by hand. Never contacts the DATASUS server. See
# tools/doc-examples/generate.cs.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - src/**
      - tools/doc-examples/**
      - tests/doc-examples/**
      - .github/workflows/doc-examples.yml
  pull_request:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - src/**
      - tools/doc-examples/**
      - tests/doc-examples/**
      - .github/workflows/doc-examples.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    name: Documentation examples (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - run: dotnet run tools/doc-examples/generate.cs

      - run: dotnet build tests/doc-examples --configuration Release

      - run: dotnet run --project tests/doc-examples --configuration Release --no-build --framework net10.0

      - run: dotnet run --project tests/doc-examples --configuration Release --no-build --framework net472
