name: Network tests

# Optional checks against the real DATASUS FTP server, run only by hand (Actions > Network tests >
# Run workflow). Never a required check: a network or server problem must not block anything, and
# the server may not be reachable from GitHub's runners at all. One connection, small files.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network:
    name: DATASUS FTP
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DBSUS_NETWORK_TESTS: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - run: dotnet build tests/DbSus.Client.Tests --configuration Release

      - run: dotnet test --project tests/DbSus.Client.Tests --configuration Release --no-build --filter-class "*NetworkTests"
