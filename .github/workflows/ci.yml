name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The SDK version comes from global.json; SDK 10 is required for .slnx and for
      # running dotnet test on Microsoft Testing Platform.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - run: dotnet restore DbSus.slnx

      - run: dotnet build DbSus.slnx --configuration Release --no-restore

      # Tests that need the large local-only samples skip themselves when the files are absent.
      - run: dotnet test --solution DbSus.slnx --configuration Release --no-build

  # Packs DbSus and DbSus.Client and runs an outside consumer against the packages, once per asset
  # (net8.0 -> netstandard2.0, net10.0 -> net10.0 and, on Windows, net481 -> net472), then with the
  # oldest accepted dependency versions pinned, and the net8.0 consumer once more built with SDK 8.
  packages:
    name: Package consumers (${{ matrix.os }})
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SDK 10 from global.json, plus SDK 8 for the net8.0 consumers (runtime 8, and the build with SDK 8).
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - run: dotnet pack DbSus.slnx --configuration Release --output artifacts/packages

      - id: version
        shell: bash
        run: echo "value=$(dotnet msbuild src/DbSus/DbSus.csproj -getProperty:PackageVersion)" >> "$GITHUB_OUTPUT"

      # DbSus.Client must declare DbSus as [its version, next breaking version-0) in every target
      # framework: the next minor during 0.x, the next major from 1.0 on. The pack writes that range
      # with a target over an internal NuGet item (see src/DbSus.Client/DbSus.Client.csproj), so the
      # range is recomputed here and checked in the nuspec of the package just built.
      - shell: pwsh
        env:
          DBSUS_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $version = $env:DBSUS_VERSION
          $core = [Version]($version -replace '[-+].*$', '')
          $next = if ($core.Major -eq 0) { "0.$($core.Minor + 1).0-0" } else { "$($core.Major + 1).0.0-0" }
          $expected = "[$version, $next)"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = Join-Path 'artifacts/packages' "DbSus.Client.$version.nupkg"
          if (-not (Test-Path $package)) { throw "$package was not found." }
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $package).Path)
          try {
            $reader = New-Object IO.StreamReader(($zip.Entries | Where-Object FullName -eq 'DbSus.Client.nuspec').Open())
            [xml]$nuspec = $reader.ReadToEnd()
            $reader.Dispose()
          } finally {
            $zip.Dispose()
          }
          $groups = @($nuspec.package.metadata.dependencies.group)
          if ($groups.Count -eq 0) { throw "DbSus.Client $version declares no dependency groups." }
          $wrong = foreach ($group in $groups) {
            $ranges = @($group.dependency | Where-Object { $_.id -eq 'DbSus' } | ForEach-Object { $_.version })
            if ($ranges.Count -ne 1 -or $ranges[0] -ne $expected) { "$($group.targetFramework): '$($ranges -join "', '")'" }
          }
          if ($wrong) { throw "DbSus.Client $version must declare DbSus $expected in every target framework; found $($wrong -join '; ')." }
          "DbSus.Client $version declares DbSus $expected in all $($groups.Count) target frameworks."

      - run: dotnet run --project tests/package-consumer --configuration Release --framework net8.0 -p:DbSusVersion=${{ steps.version.outputs.value }}

      - run: dotnet run --project tests/package-consumer --configuration Release --framework net10.0 -p:DbSusVersion=${{ steps.version.outputs.value }}

      - if: runner.os == 'Windows'
        run: dotnet run --project tests/package-consumer --configuration Release --framework net481 -p:DbSusVersion=${{ steps.version.outputs.value }}

      # An application that already references the oldest accepted dependency versions: raising a
      # minimum in src/Directory.Packages.props makes this restore fail with NU1605.
      - run: dotnet run --project tests/package-consumer --configuration Release --framework net8.0 -p:DbSusVersion=${{ steps.version.outputs.value }} -p:PinOldestDependencies=true

      - if: runner.os == 'Windows'
        run: dotnet run --project tests/package-consumer --configuration Release --framework net481 -p:DbSusVersion=${{ steps.version.outputs.value }} -p:PinOldestDependencies=true

      # The net8.0 consumer built with SDK 8 (global.json in that folder), which, unlike SDK 10, does
      # not prune in-box packages from the restore.
      - working-directory: tests/package-consumer/sdk8
        run: dotnet --version

      - working-directory: tests/package-consumer/sdk8
        run: dotnet run --configuration Release -p:DbSusVersion=${{ steps.version.outputs.value }}

      # Keeps the packages that passed every consumer above, the only ones meant for publishing.
      # Only for main (push or manual run), never for pull requests; once, from Ubuntu, since the
      # Windows checkout converts text files to CRLF and its packages would differ.
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ github.sha }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          retention-days: 7
          if-no-files-found: error

  # Publishes an application that uses only DbSus (net10.0 build) trimmed and, on Windows, with
  # Native AOT, runs it against DBF and DBC files built in memory and compares its output with that
  # of a normal run. Every trimming or AOT warning fails the publish. DbSus.Client is not marked as
  # trim or AOT compatible and is left out. See tests/trim-consumer/README.md.
  trimming:
    name: Trimming and AOT (${{ matrix.os }})
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - run: dotnet pack src/DbSus/DbSus.csproj --configuration Release --output artifacts/packages

      - id: version
        run: echo "value=$(dotnet msbuild src/DbSus/DbSus.csproj -getProperty:PackageVersion)" >> "$GITHUB_OUTPUT"

      # The reference output: a normal build, neither trimmed nor compiled ahead of time.
      - run: dotnet build tests/trim-consumer --configuration Release -p:DbSusVersion=${{ steps.version.outputs.value }}

      - run: dotnet run --project tests/trim-consumer --configuration Release --no-build -p:DbSusVersion=${{ steps.version.outputs.value }} > artifacts/trim-normal.txt

      - run: dotnet publish tests/trim-consumer --configuration Release --runtime ${{ matrix.rid }} --self-contained -p:PublishTrimmed=true -p:DbSusVersion=${{ steps.version.outputs.value }} --output artifacts/trim-trimmed

      - run: artifacts/trim-trimmed/TrimConsumer > artifacts/trim-trimmed.txt

      - run: diff artifacts/trim-normal.txt artifacts/trim-trimmed.txt

      # Native AOT on Windows needs the MSVC C++ build tools: fail with a clear message, rather than
      # a linker error, when the runner image does not have them.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'Native AOT needs the MSVC C++ build tools; vswhere.exe is not on this runner.' }
          $tools = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $tools) { throw 'Native AOT needs the MSVC C++ build tools (Microsoft.VisualStudio.Component.VC.Tools.x86.x64); this runner has none.' }
          & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property catalog_productDisplayVersion

      - if: runner.os == 'Windows'
        run: dotnet publish tests/trim-consumer --configuration Release --runtime ${{ matrix.rid }} -p:PublishAot=true -p:DbSusVersion=${{ steps.version.outputs.value }} --output artifacts/trim-aot

      - if: runner.os == 'Windows'
        run: artifacts/trim-aot/TrimConsumer > artifacts/trim-aot.txt

      - if: runner.os == 'Windows'
        run: diff artifacts/trim-normal.txt artifacts/trim-aot.txt
